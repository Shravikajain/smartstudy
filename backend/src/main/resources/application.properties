spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartstudy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB
app.upload-dir=${UPLOAD_DIR:uploads}
app.ml-service-url=${ML_SERVICE_URL:http://localhost:8000}
app.jwt-secret=${JWT_SECRET}
app.ml-internal-key=${ML_INTERNAL_KEY:}
